plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.warehouse'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.warehouse'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
}
